<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper2Real Control Room</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#070a10;--bg2:#0b1018;--panel:#101722;--panel2:#0d131d;--panel3:#141d2b;
  --line:#243248;--line2:#33435c;--text:#edf4ff;--soft:#b8c6dc;--muted:#8191ad;
  --orange:#f7931a;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#38bdf8;
  --purple:#a78bfa;--shadow:0 18px 70px rgba(0,0,0,.28);--navH:72px;--sideW:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 20% -10%,rgba(247,147,26,.14),transparent 32%),radial-gradient(circle at 90% 0,rgba(56,189,248,.11),transparent 30%),var(--bg);color:var(--text);font-family:Segoe UI,system-ui,-apple-system,sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app-shell{height:100vh;display:grid;grid-template-columns:var(--sideW) 1fr;grid-template-rows:var(--navH) 1fr;grid-template-areas:"top top" "side main"}
.top-nav{grid-area:top;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(9,13,20,.92);backdrop-filter:blur(18px);z-index:30}
.hamburger{display:none;background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.brand{min-width:210px}.brand-title{font-size:1.08rem;font-weight:900;letter-spacing:.02em;color:var(--orange)}.brand-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.nav-metrics{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;flex:1}.nav-chip{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:13px;padding:8px 10px;min-height:48px}.nav-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.nav-value{font-size:.9rem;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}.btn{border-radius:10px;padding:10px 13px;font-weight:800;color:var(--text);background:var(--panel3);border:1px solid var(--line)}.btn.primary{background:var(--orange);color:#090909;border-color:var(--orange)}.btn:hover{filter:brightness(1.08)}
.sidebar{grid-area:side;overflow:auto;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(16,23,34,.98),rgba(9,13,20,.98));padding:14px 12px;z-index:20}
.side-section{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:14px 10px 8px}.nav-item{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;background:transparent;color:var(--soft);border-radius:12px;padding:10px 10px;margin:3px 0;text-align:left}.nav-item:hover{background:rgba(255,255,255,.045)}.nav-item.active{background:linear-gradient(90deg,rgba(247,147,26,.18),rgba(56,189,248,.06));color:var(--text);box-shadow:inset 3px 0 0 var(--orange)}.nav-left{display:flex;align-items:center;gap:10px}.ico{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:#182238;color:var(--blue);font-size:.78rem;font-weight:900}.nav-item.active .ico{background:var(--orange);color:#080808}.mini-badge{font-size:.58rem;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.main{grid-area:main;overflow:auto;padding:18px 18px 28px}.page{display:none;max-width:1600px;margin:0 auto}.page.active{display:block}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}.kicker{color:var(--orange);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;font-weight:900}.page h1{font-size:1.65rem;letter-spacing:-.03em;margin-top:4px}.page-desc{color:var(--muted);font-size:.86rem;margin-top:5px;max-width:820px}.refresh-stamp{color:var(--muted);font-size:.76rem}
.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(4,minmax(170px,1fr))}.cards.compact{grid-template-columns:repeat(5,minmax(145px,1fr))}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}
.card,.panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:14px;min-height:102px}.panel{padding:16px;margin-bottom:14px}.label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.value{font-size:1.38rem;font-weight:900;margin-top:8px;line-height:1.05}.hint{font-size:.76rem;color:var(--muted);margin-top:7px;line-height:1.35}.panel-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:13px;color:var(--soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:.68rem;font-weight:900;text-transform:uppercase;border:1px solid var(--line);white-space:nowrap}.buy,.ok,.bullish,.healthy{color:var(--green);background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35)}.sell,.risk,.error,.bearish{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35)}.hold,.warning,.blocked{color:var(--yellow);background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.35)}.shadow,.info,.neutral{color:var(--blue);background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.35)}.purple{color:var(--purple);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.35)}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.orange{color:var(--orange)}.blue{color:var(--blue)}.muted{color:var(--muted)}
.progress-wrap{height:9px;border:1px solid var(--line);background:#080d15;border-radius:999px;overflow:hidden;margin-top:10px}.progress-bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--green));border-radius:999px}.action-card{border:1px solid rgba(247,147,26,.38);background:linear-gradient(135deg,rgba(247,147,26,.14),rgba(56,189,248,.06));padding:18px;border-radius:18px;box-shadow:var(--shadow)}
.table-wrap{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:13px}.table-wrap.tall{max-height:520px}table{width:100%;border-collapse:separate;border-spacing:0}th{position:sticky;top:0;z-index:2;background:#111a27;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:10px 11px}td{border-top:1px solid var(--line);padding:10px 11px;font-size:.79rem;vertical-align:top;color:#d8e3f5}.clip{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);text-align:center;padding:26px}
.chart{height:260px}.chart.sm{height:190px}.chart.lg{height:360px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter{background:#111a27;border:1px solid var(--line);border-radius:999px;color:var(--soft);padding:7px 10px;font-size:.75rem;font-weight:800}.filter.active{background:var(--orange);border-color:var(--orange);color:#080808}
details{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);margin-bottom:10px;overflow:hidden}summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.07em;font-size:.76rem}summary::-webkit-details-marker{display:none}.detail-body{padding:0 14px 14px}
.audit{white-space:pre-wrap;background:#080d15;border:1px solid var(--line);border-radius:13px;padding:13px;max-height:390px;overflow:auto;font-size:.78rem;line-height:1.48;color:#d5e0f3}.warn{border:1px solid rgba(234,179,8,.45);background:rgba(234,179,8,.1);color:var(--yellow);border-radius:13px;padding:12px;margin-bottom:12px}.danger{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1);color:#fecaca}.safe{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);color:#bbf7d0}
.logs{max-height:530px;overflow:auto}.logline{font-family:Consolas,monospace;font-size:.75rem;border-bottom:1px solid var(--line);padding:7px 0;color:#d5e0f3}.logline .lvl{display:inline-block;width:62px;font-weight:900}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.report-item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0b111b}.report-name{font-weight:850}.report-meta{font-size:.72rem;color:var(--muted);margin-top:3px}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.evidence ul{margin-left:18px;color:#d9e4f6;font-size:.82rem;line-height:1.55}.settings-list{display:grid;gap:10px}.guardrail{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0b111b}
.mobile-overlay{display:none}
@media(max-width:1250px){.nav-metrics{grid-template-columns:repeat(3,1fr)}.cards,.cards.compact{grid-template-columns:repeat(3,1fr)}.cols3,.cols4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){body{overflow:auto}.app-shell{height:auto;min-height:100vh;display:block}.top-nav{position:sticky;top:0}.hamburger{display:block}.brand{min-width:0}.nav-metrics{display:none}.top-actions .btn.primary{display:none}.sidebar{position:fixed;inset:var(--navH) auto 0 0;width:82vw;max-width:310px;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-overlay.open{display:block;position:fixed;inset:var(--navH) 0 0;background:rgba(0,0,0,.5);z-index:10}.main{overflow:visible;padding:14px}.cards,.cards.compact,.cols2,.cols3,.cols4,.evidence,.report-grid{grid-template-columns:1fr}.page-head{display:block}.top-actions{margin-left:auto}.chart.lg{height:280px}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="top-nav" id="topNav">
    <button class="hamburger" id="menuBtn" aria-label="Open navigation">Menu</button>
    <div class="brand"><div class="brand-title">Paper2Real</div><div class="brand-sub">trading research control room</div></div>
    <div class="nav-metrics">
      <div class="nav-chip"><div class="nav-label">System</div><div class="nav-value" id="navHealth">--</div></div>
      <div class="nav-chip"><div class="nav-label">BTC</div><div class="nav-value orange" id="navPrice">--</div></div>
      <div class="nav-chip"><div class="nav-label">Final Action</div><div class="nav-value" id="navFinal">--</div></div>
      <div class="nav-chip"><div class="nav-label">Recommendation</div><div class="nav-value" id="navRecommendation">--</div></div>
      <div class="nav-chip"><div class="nav-label">Last Scan</div><div class="nav-value" id="navLastScan">--</div></div>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="downloadFile('/download/all.zip')">Download ZIP</button>
      <button class="btn primary" id="refreshBtn" onclick="refreshCurrentPage()">Refresh</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="side-section">Monitor</div>
    <button class="nav-item active" data-page="overview"><span class="nav-left"><span class="ico">O</span>Overview</span><span class="mini-badge" id="badge-overview">live</span></button>
    <button class="nav-item" data-page="live-decision"><span class="nav-left"><span class="ico">D</span>Live Decision</span><span class="mini-badge" id="badge-decision">--</span></button>
    <button class="nav-item" data-page="risk-engine"><span class="nav-left"><span class="ico">R</span>Risk Engine</span><span class="mini-badge" id="badge-risk">safe</span></button>
    <button class="nav-item" data-page="shadow-learning"><span class="nav-left"><span class="ico">S</span>Shadow Learning</span><span class="mini-badge">shadow</span></button>
    <div class="side-section">Research</div>
    <button class="nav-item" data-page="smart-money"><span class="nav-left"><span class="ico">M</span>Smart Money</span><span class="mini-badge">shadow</span></button>
    <button class="nav-item" data-page="technical-analysis"><span class="nav-left"><span class="ico">T</span>Technical Analysis</span><span class="mini-badge">TA</span></button>
    <button class="nav-item" data-page="ai-technical-analyst"><span class="nav-left"><span class="ico">AI</span>AI Technical Analyst</span><span class="mini-badge">AI</span></button>
    <div class="side-section">Operations</div>
    <button class="nav-item" data-page="reports"><span class="nav-left"><span class="ico">P</span>Reports</span><span class="mini-badge">files</span></button>
    <button class="nav-item" data-page="system-health"><span class="nav-left"><span class="ico">H</span>System Health</span><span class="mini-badge">ops</span></button>
    <button class="nav-item" data-page="downloads-logs"><span class="nav-left"><span class="ico">L</span>Downloads / Logs</span><span class="mini-badge">zip</span></button>
    <button class="nav-item" data-page="guardrails"><span class="nav-left"><span class="ico">G</span>Settings / Guardrails</span><span class="mini-badge">read</span></button>
  </aside>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <main class="main">
    <section class="page active" id="page-overview"></section>
    <section class="page" id="page-live-decision"></section>
    <section class="page" id="page-risk-engine"></section>
    <section class="page" id="page-shadow-learning"></section>
    <section class="page" id="page-smart-money"></section>
    <section class="page" id="page-technical-analysis"></section>
    <section class="page" id="page-ai-technical-analyst"></section>
    <section class="page" id="page-reports"></section>
    <section class="page" id="page-system-health"></section>
    <section class="page" id="page-downloads-logs"></section>
    <section class="page" id="page-guardrails"></section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const charts = {};
const cache = {};
let currentPage = localStorage.getItem("p2rSelectedPage") || "overview";
let currentDecisionFilter = "all";
let currentLogFilter = "all";

function formatNumber(value, digits = 2){
  if(value === null || value === undefined || value === "" || Number.isNaN(Number(value))) return "--";
  return Number(value).toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits});
}
function formatMoney(value, digits = 2){return value === null || value === undefined ? "$--" : "$" + formatNumber(value,digits)}
function formatPct(value, digits = 2){return value === null || value === undefined ? "--" : (Number(value)>=0?"+":"") + Number(value).toFixed(digits) + "%"}
function formatDateTime(value){
  if(!value) return "--";
  const raw = String(value);
  const date = raw.length === 10 && /^\d+$/.test(raw) ? new Date(Number(raw)*1000) : new Date(value);
  return Number.isNaN(date.getTime()) ? raw : date.toLocaleString();
}
function compactDate(value){
  if(!value) return "--";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value).slice(0,19) : date.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(value){
  return String(value ?? "--").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function classForAction(value){
  const v = String(value || "").toLowerCase();
  if(v.includes("buy") || v.includes("bull") || v === "ok" || v === "healthy" || v === "yes") return "buy";
  if(v.includes("sell") || v.includes("bear") || v.includes("risk") || v.includes("error") || v === "no") return "sell";
  if(v.includes("block") || v.includes("warn") || v.includes("hold") || v.includes("stale")) return "hold";
  if(v.includes("shadow") || v.includes("analysis") || v.includes("collect")) return "purple";
  return "neutral";
}
function renderBadge(value, extraClass = ""){
  return `<span class="badge ${extraClass || classForAction(value)}">${escapeHtml(value || "--")}</span>`;
}
function renderCard(label,value,hint="",tone=""){
  return `<div class="card"><div class="label">${escapeHtml(label)}</div><div class="value ${tone}">${value ?? "--"}</div><div class="hint">${hint || ""}</div></div>`;
}
function renderProgressBar(current,target){
  const safeTarget = Number(target || 0);
  const safeCurrent = Number(current || 0);
  const pct = safeTarget > 0 ? Math.max(0,Math.min(100,(safeCurrent/safeTarget)*100)) : 0;
  return `<div class="progress-wrap"><div class="progress-bar" style="width:${pct.toFixed(1)}%"></div></div><div class="hint">${safeCurrent} / ${safeTarget} · ${pct.toFixed(1)}%</div>`;
}
function renderTable(columns, rows, emptyText="No data", rowMapper=null){
  const body = (rows || []).length
    ? (rows || []).map(row => `<tr>${(rowMapper ? rowMapper(row) : columns.map(col => `<td>${escapeHtml(row[col.key])}</td>`).join(""))}</tr>`).join("")
    : `<tr><td class="empty" colspan="${columns.length}">${escapeHtml(emptyText)}</td></tr>`;
  return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${escapeHtml(c.label)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}
async function safeFetchJson(path, options){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 14000);
  try{
    const response = await fetch(path, {...(options || {}), signal: controller.signal});
    if(!response.ok) throw new Error(`${path} ${response.status}`);
    const data = await response.json();
    cache[path] = data;
    return {ok:true,path,data};
  }catch(error){
    console.warn("Dashboard endpoint failed", path, error);
    return {ok:false,path,error:String(error.message || error),data:cache[path]};
  }finally{
    clearTimeout(timeout);
  }
}
function getData(result, fallback){return result?.data ?? fallback}
function chart(id,type,labels,datasets,options={}){
  const el = $(id);
  if(!el || !window.Chart) return;
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:options.legend ?? true,labels:{color:"#8191ad"}},tooltip:{backgroundColor:"#101722",borderColor:"#243248",borderWidth:1}},scales:{x:{grid:{color:"#1a2535"},ticks:{color:"#8191ad",maxTicksLimit:9}},y:{grid:{color:"#1a2535"},ticks:{color:"#8191ad"}}},...options}});
}
function pageShell(kicker,title,desc,body){
  return `<div class="page-head"><div><div class="kicker">${kicker}</div><h1>${title}</h1><div class="page-desc">${desc}</div></div><div class="refresh-stamp">Last refreshed: <span class="page-refreshed">${new Date().toLocaleTimeString()}</span></div></div>${body}`;
}
function downloadFile(url){window.location.href = url}
function setPage(page){
  currentPage = page;
  localStorage.setItem("p2rSelectedPage", page);
  document.querySelectorAll(".page").forEach(el => el.classList.toggle("active", el.id === `page-${page}`));
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.page === page));
  $("sidebar").classList.remove("open"); $("mobileOverlay").classList.remove("open");
  refreshCurrentPage();
}
function updateTopNav({portfolio, decisions, daily, health} = {}){
  const latest = (decisions?.decisions || [])[0] || {};
  const dailyHealth = daily?.system_health || {};
  $("navHealth").innerHTML = renderBadge(health?.status || dailyHealth.system_health_status || daily?.system_health_status || "--");
  $("navPrice").textContent = portfolio?.btc_price_usd ? formatMoney(portfolio.btc_price_usd,2) : "--";
  $("navFinal").innerHTML = latest.final_action ? renderBadge(latest.final_action) : "--";
  const rec = typeof daily?.final_recommendation === "string" ? daily.final_recommendation : (daily?.final_recommendation?.primary || (daily?.recommendations || [])[0]);
  $("navRecommendation").textContent = rec || "--";
  $("navLastScan").textContent = latest.timestamp ? compactDate(latest.timestamp) : "--";
  $("badge-decision").textContent = latest.final_action || "--";
  $("badge-risk").textContent = latest.blocked_by ? "blocked" : "safe";
}
async function loadSharedNav(){
  const [portfolio,decisions,daily,health] = await Promise.all([safeFetchJson("/portfolio"),safeFetchJson("/decisions"),safeFetchJson("/daily-validation-report"),safeFetchJson("/system-health")]);
  updateTopNav({portfolio:getData(portfolio,{}),decisions:getData(decisions,{}),daily:getData(daily,{}),health:getData(health,{})});
}

async function loadOverview(){
  const target = $("page-overview");
  const [portfolio,decisions,daily,api,riskBlock,shadow,sm,ta,aiTa,health] = await Promise.all([
    safeFetchJson("/portfolio"),safeFetchJson("/decisions"),safeFetchJson("/daily-validation-report"),safeFetchJson("/api-usage"),safeFetchJson("/risk-block-performance"),safeFetchJson("/shadow-performance"),safeFetchJson("/smart-money"),safeFetchJson("/ta-forecast"),safeFetchJson("/ai-technical-analyst"),safeFetchJson("/system-health")
  ]);
  const p=getData(portfolio,{}), d=getData(decisions,{summary:{},decisions:[]}), dailyData=getData(daily,{}), apiData=getData(api,{}), risk=getData(riskBlock,{}), shadowData=getData(shadow,{summary:{}}), smData=getData(sm,{}), taData=getData(ta,{}), aiData=getData(aiTa,{}), h=getData(health,{});
  const progress = dailyData.progress_targets || {};
  const rec = typeof dailyData.final_recommendation === "string" ? dailyData.final_recommendation : (dailyData.final_recommendation?.primary || (dailyData.recommendations || [])[0] || "KEEP_COLLECTING_DATA");
  const nextAction = [
    rec || "Keep collecting data",
    "Do not change risk_engine.py from dashboard",
    "Do not enable Smart Money, TA, or AI TA bonuses",
    `Next checkpoint: shadow_buy_count >= ${dailyData.shadow_buy_review_target || 100}`
  ];
  target.innerHTML = pageShell("Overview","Command Center","A compact read-only summary of trading state, shadow learning progress, API cost, and what needs attention next.",`
    <div class="grid cards compact">
      ${renderCard("System Health",renderBadge(h.status || dailyData.system_health?.system_health_status || "--"),"live endpoint + validation report")}
      ${renderCard("Dataset Freshness",renderBadge(dailyData.stale_dataset_warning || dailyData.system_health?.stale_dataset_warning ? "stale" : "fresh"),`last date ${dailyData.master_dataset_last_date || dailyData.system_health?.master_dataset_last_date || "--"}`)}
      ${renderCard("Trades Executed",d.summary?.trades_executed ?? 0,`${d.summary?.total_scans || 0} scans measured`)}

async function refreshCurrentPage(){
  $("refreshBtn").disabled=true;
  const loaders={
    "overview":loadOverview,
    "live-decision":loadLiveDecision,
    "risk-engine":loadRiskEngine,
    "shadow-learning":loadShadowLearning,
    "smart-money":loadSmartMoney,
    "technical-analysis":loadTechnicalAnalysis,
    "ai-technical-analyst":loadAiTechnicalAnalyst,
    "reports":loadReports,
    "system-health":loadSystemHealth,
    "downloads-logs":loadDownloads,
    "guardrails":loadGuardrails
  };
  const pageLoader = loaders[currentPage] || loadOverview;
  const pagePromise = pageLoader().catch(error => {
    $(`page-${currentPage}`).innerHTML = `<div class="warn danger">Failed to load this page: ${escapeHtml(error.message || error)}</div>`;
  });
  await Promise.allSettled([loadSharedNav(), pagePromise]);
  $("refreshBtn").disabled=false;
}
function initDashboard(){
  document.querySelectorAll(".nav-item").forEach(btn=>btn.addEventListener("click",()=>setPage(btn.dataset.page)));
  $("menuBtn").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
  $("mobileOverlay").addEventListener("click",()=>{$("sidebar").classList.remove("open");$("mobileOverlay").classList.remove("open")});
  if(!$(`page-${currentPage}`)) currentPage="overview";
  document.querySelectorAll(".nav-item").forEach(btn=>btn.classList.toggle("active",btn.dataset.page===currentPage));
  document.querySelectorAll(".page").forEach(el=>el.classList.toggle("active",el.id===`page-${currentPage}`));
  refreshCurrentPage();
  setInterval(()=>refreshCurrentPage(),60000);
}
initDashboard();
